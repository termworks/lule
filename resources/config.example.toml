# lule's configuration. Put this at ~/.config/lule/config.toml, or wherever
# $LULE_C points. Everything here is a default: the environment overrides the
# file, and a command-line flag overrides both.

[settings]
# Where to pick a wallpaper from. ~ is expanded; nothing here goes through a shell.
wallpaper = "~/.wallpaper"

# Where the generated colours are cached.
cache = "~/.cache/lule"

theme = "dark"          # dark | light
palette = "pigment"
sort = "dominance"      # dominance | hue | light | dark | chroma

# Minimum WCAG contrast for the sixteen ANSI colours against the background.
# aa (4.5:1) | aaa (7:1) | none | a ratio such as 3.0
contrast = "aa"

# saturation = 0.0      # -1.0 grey .. 0 unchanged .. 1.0 doubled
# illumination = 0.0    # -1.0 darker .. 0 unchanged .. 1.0 lighter
# hue = 0.0             # rotate every pigment round the wheel
# blend = 0.0           # 0 unchanged .. 1.0 all one hue
# seed = 0              # non-zero gives the same scheme for the same wallpaper
# norandom = false
# loop = 300            # daemon interval, in seconds

# One table per template. The name is yours; it is only used in messages and to
# keep the order stable.
[templates.kitty]
input = "~/.config/lule/templates/kitty.conf"
output = "~/.config/kitty/colors.conf"

[templates.waybar]
input = "~/.config/lule/templates/waybar.css"
output = "~/.config/waybar/colors.css"
