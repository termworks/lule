name: tests

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:

jobs:
  build:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both arches are released, so both are built here. An arm64 break that only shows up
          # at release time is a break found after the tag exists.
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      # The toolchain comes from the flake, so CI and a developer's shell run the exact same V.
      # Installing a V of its own gave this workflow a second pin, and the two drifted: an
      # upstream V release changed the formatter and `v fmt -verify` failed here on a commit that
      # touched no V source at all.
      - uses: DeterminateSystems/nix-installer-action@main

      - name: Toolchain
        run: nix develop .#ci --command v version

      - name: Formatting
        run: nix develop .#ci --command v fmt -verify src/

      - name: Vet
        run: nix develop .#ci --command v vet src/

      - name: Build
        run: |
          mkdir -p target
          nix develop .#ci --command bash -c \
            'v -prod -cflags "-static -L$GLIBC_STATIC/lib" src/ -o target/lule'

      - name: Verify it is really static
        run: |
          nix develop .#ci --command bash -c '
            set -euo pipefail
            if readelf -l target/lule | grep -q "program interpreter"; then
              echo "::error::target/lule requests a dynamic loader; it is not static"; exit 1
            fi
            if readelf -d target/lule 2>/dev/null | grep -q "NEEDED"; then
              echo "::error::target/lule has NEEDED entries; it is not static"; exit 1
            fi
            file target/lule'

      - name: V tests
        run: nix develop .#ci --command v test src/

      - name: Smoke test
        run: |
          set -euo pipefail
          cache="$(mktemp -d)"
          # LULE_S names the caller's real colour-applying script. A runner has none, but an
          # empty value is the explicit statement that none should run.
          export LULE_A="$cache" LULE_S=""
          ./target/lule --version
          ./target/lule create --image=resources/theme_dark.png -- set
          count="$(grep -c . "$cache/colors")"
          [ "$count" = "256" ] || { echo "::error::expected 256 colours, got $count"; exit 1; }
          distinct="$(sed -n '2,7p' "$cache/colors" | sort -u | wc -l)"
          [ "$distinct" = "6" ] || { echo "::error::only $distinct distinct ANSI colours"; exit 1; }
          ./target/lule create --image=resources/theme_light.png --theme=light -- set
          ./target/lule create -- regen
          ./target/lule colors -- ansii | head -3
          ./target/lule colors -- json | head -3
          echo "smoke: $count colours, $distinct distinct"
