name: tests

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both arches are released, so both are built here. An arm64 break that only shows up
          # at release time is a break found after the tag exists.
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install V
        uses: vlang/setup-v@v1.7
        with:
          # The latest V *release*, not the latest commit. `check-latest` follows master, whose
          # formatter changes under you — that failed `v fmt -verify` here on a commit that
          # touched no V source. A pinned `version:` is worse still: setup-v builds it from
          # source, and 0.5.2 no longer bootstraps against the current `vc`.
          #
          # `stable` downloads the release prebuilt, and V ships both v_linux and
          # v_linux_arm64, so one line covers both runners.
          stable: true

      # A warning, not a failure. When V cuts a release, `stable` moves and the flake does not —
      # and the first symptom would otherwise be `v fmt -verify` failing for no visible reason.
      # This puts the explanation directly above it. Bump .v-version and the flake to clear it.
      - name: Toolchain drift check
        run: |
          set -euo pipefail
          want="$(cat .v-version)"
          have="$(v version | awk '{print $2}')"
          if [ "$want" != "$have" ]; then
            echo "::warning::CI has V $have but .v-version pins $want."
            echo "::warning::A formatting failure below is likely toolchain drift, not your commit."
          fi
          echo "V $have (.v-version: $want)"

      - name: Formatting
        run: v fmt -verify src/

      - name: Vet
        run: v vet src/

      - name: Build
        run: |
          mkdir -p target
          v -prod -cflags -static src/ -o target/lule

      - name: Verify it is really static
        run: |
          set -euo pipefail
          if readelf -l target/lule | grep -q 'program interpreter'; then
            echo "::error::target/lule requests a dynamic loader; it is not static"; exit 1
          fi
          if readelf -d target/lule 2>/dev/null | grep -q 'NEEDED'; then
            echo "::error::target/lule has NEEDED entries; it is not static"; exit 1
          fi

      - name: V tests
        run: v test src/

      - name: Smoke test
        run: |
          set -euo pipefail
          cache="$(mktemp -d)"
          export LULE_A="$cache" LULE_S=""
          ./target/lule --version
          ./target/lule create --image=resources/theme_dark.png -- set
          count="$(grep -c . "$cache/colors")"
          [ "$count" = "256" ] || { echo "::error::expected 256 colours, got $count"; exit 1; }
          ./target/lule create --image=resources/theme_light.png --theme=light -- set
          ./target/lule create -- regen
          ./target/lule colors -- ansii | head -3
          echo "smoke: $count colours"
