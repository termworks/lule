name: release

on:
  release:
    types: [created]
  # So a failed or missing asset can be rebuilt without cutting another tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and upload assets for'
        required: false
      dry_run:
        description: 'Build and package both arches, but upload nothing'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both native. V compiles to C and then links, so cross-compiling means carrying a
          # cross toolchain and a foreign libc.a; GitHub's arm64 runners are free for public
          # repositories, which makes the native build both simpler and the one actually tested.
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      # Installed straight from the release rather than through vlang/setup-v. The action builds
      # from source on arm64 — and V 0.5.2's source no longer bootstraps against the current `vc`
      # ("C.open was already declared with a different signature"), so both runners died in the
      # bootstrap. The release ships a prebuilt for each arch, which is also an exact pin: CI and
      # the flake run the same compiler, so `v fmt -verify` cannot disagree between them.
      - name: Install V
        run: |
          set -euo pipefail
          version="$(cat .v-version)"
          case "${{ matrix.arch }}" in
            amd64) asset=v_linux.zip ;;
            arm64) asset=v_linux_arm64.zip ;;
            *) echo "::error::no V prebuilt for ${{ matrix.arch }}"; exit 1 ;;
          esac
          curl -fsSL --retry 3 -o /tmp/v.zip \
            "https://github.com/vlang/v/releases/download/${version}/${asset}"
          unzip -q /tmp/v.zip -d "$HOME"
          echo "$HOME/v" >> "$GITHUB_PATH"
          "$HOME/v/v" version

      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          tag='${{ github.event.release.tag_name || inputs.tag }}'
          version="$(sed -nE "s/^[[:space:]]*version:[[:space:]]*'([^']+)'.*/\1/p" v.mod | head -1)"
          [ -n "$version" ] || { echo "no version in v.mod"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=lule-${version}-linux-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: Build static binary
        run: |
          set -euo pipefail
          mkdir -p target
          # libc.a comes from libc6-dev, which the runner images already carry. Checked rather
          # than assumed, because without it the failure is a linker error about -lc from inside
          # a C file V generated, which reads as a compiler bug rather than a missing package.
          if ! ls /usr/lib/*/libc.a >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y libc6-dev
          fi
          v -prod -cflags -static src/ -o target/lule

      - name: Verify it is really static
        run: |
          set -euo pipefail
          # `ldd` is not enough: it prints "statically linked" for a binary that still carries an
          # INTERP and will not start. The ELF is the thing making the claim, so ask the ELF.
          if readelf -l target/lule | grep -q 'program interpreter'; then
            echo "::error::target/lule requests a dynamic loader; it is not static"; exit 1
          fi
          if readelf -d target/lule 2>/dev/null | grep -q 'NEEDED'; then
            echo "::error::target/lule has NEEDED entries; it is not static"; exit 1
          fi
          file target/lule
          echo "static: no INTERP, no NEEDED"

      - name: Smoke test
        run: |
          set -euo pipefail
          cache="$(mktemp -d)"
          # LULE_S names the caller's real colour-applying script. A runner has none, but an
          # empty value is the explicit statement that none should run.
          export LULE_A="$cache" LULE_S=""
          ./target/lule --version
          ./target/lule create --image=resources/theme_dark.png -- set
          count="$(grep -c . "$cache/colors")"
          [ "$count" = "256" ] || { echo "::error::expected 256 colours, got $count"; exit 1; }
          grep -qE '^#[0-9a-f]{6}$' "$cache/colors" || { echo "::error::not hex colours"; exit 1; }
          echo "smoke: $count colours"

      - name: Package
        run: |
          set -euo pipefail
          strip target/lule
          dist="${{ steps.meta.outputs.name }}"
          mkdir -p "dist/$dist"
          cp target/lule "dist/$dist/"
          cp README.md LICENSE.md CHANGELOG.md "dist/$dist/" 2>/dev/null || true
          # tar.gz only. A zip beside it would need `zip` present on both runner images for no
          # gain — this is a Linux-only release, and tar is what unpacks it.
          tar -czf "dist/${dist}.tar.gz" -C dist "$dist"
          ( cd dist && sha256sum "${dist}.tar.gz" > "${dist}.sha256" )
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 7

  publish:
    name: publish assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: One checksum file for every asset
        run: |
          set -euo pipefail
          cd dist
          cat ./*.sha256 > SHA256SUMS
          rm -f ./*.sha256
          sha256sum -c SHA256SUMS
          ls -la

      # A dispatch defaults to dry run so the whole pipeline can be exercised — both arches built,
      # packaged and checksummed — without publishing anything. A `release: created` event never
      # takes this branch, so cutting a real release still uploads.
      - name: Dry run, nothing uploaded
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          echo "::notice::dry run - built and packaged, uploaded nothing"
          ls -la dist/

      - name: Upload to the release
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ github.event.release.tag_name || inputs.tag }}'
          [ -n "$tag" ] || { echo "::error::no tag to upload to"; exit 1; }
          gh release upload "$tag" dist/SHA256SUMS dist/*.tar.gz --clobber --repo '${{ github.repository }}'
