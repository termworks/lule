name: book

on:
  push:
    branches:
      - develop
    # Only when the book or this workflow actually changes. It used to rebuild and redeploy on
    # every commit, including ones touching nothing but V source.
    paths:
      - 'book/**'
      - '.github/workflows/book.yml'
      - 'flake.lock'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy_site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # mdbook comes from the flake, like V does for the other two workflows. Pinned by hand it
      # was a second pin, and this workflow had already broken twice on a moving 'latest':
      # mdbook 0.5 dropped the `multilingual` key book.toml carried, and it changed --dest-dir to
      # resolve against the working directory rather than the book root.
      - uses: DeterminateSystems/nix-installer-action@main

      - name: Toolchain
        run: nix develop .#docs --command mdbook --version

      # `docs`, not `../docs`. Under mdbook 0.5 the latter resolves against the working directory
      # and writes the book *outside* the checkout, leaving publish_dir pointing at nothing.
      - name: Build
        run: nix develop .#docs --command mdbook build book --dest-dir docs

      - name: Fail if the build produced nothing
        run: test -f docs/index.html || { echo "::error::book output is missing"; exit 1; }

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
